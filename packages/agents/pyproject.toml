[project]
name = "revenueguard-agents"
version = "0.1.0"
description = "Bounded RevenueGuard agent orchestration"
requires-python = ">=3.14,<3.15"
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.12",
  "revenueguard-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_agents"]

[tool.uv.sources]
revenueguard-domain = { workspace = true }
