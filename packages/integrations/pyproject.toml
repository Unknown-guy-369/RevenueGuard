[project]
name = "revenueguard-integrations"
version = "0.1.0"
description = "External provider adapters for RevenueGuard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "asyncpg>=0.31",
  "revenueguard-agents",
  "revenueguard-domain",
  "sqlalchemy[asyncio]>=2.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_integrations"]

[tool.uv.sources]
revenueguard-agents = { workspace = true }
revenueguard-domain = { workspace = true }
