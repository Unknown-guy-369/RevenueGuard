[project]
name = "revenueguard-observability"
version = "0.1.0"
description = "Telemetry helpers for RevenueGuard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "opentelemetry-api>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_observability"]
