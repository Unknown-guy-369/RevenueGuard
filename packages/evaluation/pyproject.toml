[project]
name = "revenueguard-evaluation"
version = "0.1.0"
description = "Reproducible evaluation tooling for RevenueGuard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "revenueguard-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_evaluation"]

[tool.uv.sources]
revenueguard-domain = { workspace = true }
