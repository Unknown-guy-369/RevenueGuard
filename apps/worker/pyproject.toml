[project]
name = "revenueguard-worker"
version = "0.1.0"
description = "RevenueGuard Celery worker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "celery[redis]>=5.5",
  "pydantic-settings>=2.11",
  "revenueguard-agents",
  "revenueguard-domain",
  "revenueguard-integrations",
  "revenueguard-observability",
  "sqlalchemy[asyncio]>=2.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_worker"]

[tool.uv.sources]
revenueguard-agents = { workspace = true }
revenueguard-domain = { workspace = true }
revenueguard-integrations = { workspace = true }
revenueguard-observability = { workspace = true }
