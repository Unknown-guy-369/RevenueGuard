[project]
name = "revenueguard-api"
version = "0.1.0"
description = "RevenueGuard FastAPI service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17",
  "asyncpg>=0.31",
  "fastapi>=0.121",
  "pydantic-settings>=2.11",
  "redis>=6.4,<6.5",
  "revenueguard-domain",
  "revenueguard-integrations",
  "revenueguard-observability",
  "sqlalchemy[asyncio]>=2.0.44",
  "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenueguard_api"]

[tool.uv.sources]
revenueguard-domain = { workspace = true }
revenueguard-integrations = { workspace = true }
revenueguard-observability = { workspace = true }
